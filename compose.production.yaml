# Standalone production configuration. Do not combine it with the demo compose file.
# Run behind an HTTPS reverse proxy on this host.
services:
  signbridge:
    build: .
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      ENV: production
      DATABASE_PATH: /app/data/signbridge.db
      APP_URL: ${APP_URL:?Set the canonical HTTPS origin}
      CORS_ORIGINS: ${APP_URL:?Set the canonical HTTPS origin}
      SMTP_HOST: ${SMTP_HOST:?Set an SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: '1'
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?Set an approved sender address}
      TRUST_PROXY: '0'
    volumes:
      - signbridge_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  signbridge_data:
